# This workflow installs dependencies, builds the application,
# and runs tests for the HustleHub API.

name: Node.js CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:

    # Download the repository code.
    - uses: actions/checkout@v4

    # Set up the required Node.js version.
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: "npm"
        cache-dependency-path: api/package-lock.json

    # Install dependencies from the API project.
    - name: Install dependencies
      working-directory: api
      run: npm ci

    # Build the API if a build script exists.
    - name: Build
      working-directory: api
      run: npm run build --if-present

    # Run the API tests.
    - name: Test
      working-directory: api
      run: npm test