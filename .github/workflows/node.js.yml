# This workflow installs dependencies, builds the application,
# and runs tests for the HustleHub API and frontend.

name: Node.js CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    name: Backend dependency install, unit tests, and Newman API tests

    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:

    # Download the repository code.
    - uses: actions/checkout@v4

    # Set up the required Node.js version.
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: "npm"
        cache-dependency-path: api/package-lock.json

    # Install dependencies from the API project.
    - name: Install dependencies
      working-directory: api
      run: npm ci

    # Build the API if a build script exists.
    - name: Build
      working-directory: api
      run: npm run build --if-present

    # Run the API tests.
    - name: Test
      working-directory: api
      continue-on-error: false
      run: npm test

    - name: Start API
      working-directory: api
      env:
        MONGO_URI: mongodb://127.0.0.1:27017/hustlehub
        JWT_SECRET: ci-test-secret
        USE_HTTPS: "false"
        PORT: 4000
      run: |
        npm start > "$RUNNER_TEMP/api.log" 2>&1 &
        for attempt in $(seq 1 30); do
          if curl --fail --silent http://127.0.0.1:4000/health; then
            exit 0
          fi
          sleep 2
        done
        cat "$RUNNER_TEMP/api.log"
        exit 1

    # Run the API integration collection against the local CI server.
    - name: Run Newman API tests
      working-directory: api
      run: npm run test:api -- --env-var "baseUrl=http://127.0.0.1:4000"

  frontend:
    name: Frontend dependency install and tests

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:

    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: "npm"
        cache-dependency-path: client/package-lock.json

    - name: Install dependencies
      working-directory: client
      run: npm ci

    - name: Build
      working-directory: client
      run: npm run build

    - name: Test
      working-directory: client
      continue-on-error: false
      run: npm test